<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UGC Hook Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #ebe5d9;
      --bg-secondary: #d4cfc2;
      --text-primary: #2c2c2c;
      --text-secondary: #5a5a5a;
      --accent-primary: #6b5b95;
      --accent-secondary: #d4a574;
      --border-color: #8b7d6b;
    }

    body.dark-mode {
      --bg-primary: #3d3d4d;
      --bg-secondary: #2d2d3d;
      --text-primary: #e8e8d0;
      --text-secondary: #b0b0a0;
      --accent-primary: #9b8bb5;
      --accent-secondary: #d4a574;
      --border-color: #6b5b4b;
    }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: linear-gradient(135deg, #8b7d6b 0%, #6b5b95 100%);
      min-height: 100vh;
      padding: 30px 20px;
      color: var(--text-primary);
    }

    .top-bar {
      max-width: 1400px;
      margin: 0 auto 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-primary);
      border: 3px solid var(--border-color);
      padding: 15px 20px;
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.2);
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-primary);
      letter-spacing: 1px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .icon-btn {
      background: var(--accent-secondary);
      border: 2px solid var(--border-color);
      width: 44px;
      height: 44px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.2);
      transition: all 0.1s;
    }

    .icon-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 rgba(0, 0, 0, 0.2);
    }

    .wrapper {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: start;
    }

    .form-section {
      background: var(--bg-primary);
      border: 3px solid var(--border-color);
      padding: 30px;
      box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.15);
    }

    .form-header {
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--border-color);
    }

    .form-header h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-primary);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .form-header p {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 8px 14px;
      background: var(--bg-secondary);
      border: 2px solid var(--border-color);
      cursor: pointer;
      color: var(--text-secondary);
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
      font-size: 12px;
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.1);
      transition: all 0.1s;
    }

    .tab:hover {
      background: var(--accent-secondary);
      color: var(--text-primary);
    }

    .tab.active {
      background: var(--accent-primary);
      color: var(--bg-primary);
      border-color: var(--accent-primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--accent-primary);
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid var(--border-color);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--text-secondary);
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent-primary);
      background: var(--bg-primary);
      box-shadow: inset 2px 2px 0 rgba(107, 91, 149, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--accent-primary);
      color: var(--bg-primary);
      border: 2px solid var(--accent-primary);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.2);
      transition: all 0.1s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button:hover {
      background: var(--accent-secondary);
      color: var(--text-primary);
      border-color: var(--accent-secondary);
    }

    button:active {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 rgba(0, 0, 0, 0.2);
    }

    .results-section {
      background: var(--bg-primary);
      border: 3px solid var(--border-color);
      padding: 30px;
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.15);
    }

    .empty-state {
      text-align: center;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .empty-state p {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .loading-container {
      text-align: center;
    }

    .loading-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent-primary);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .animated-dots {
      font-size: 20px;
      margin: 15px 0;
      letter-spacing: 8px;
      color: var(--accent-secondary);
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: var(--accent-secondary);
      margin: 0 3px;
      animation: bounce 1.4s infinite;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scaleY(0.3); }
      40% { transform: scaleY(1); }
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      margin: 15px 0;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      width: 0%;
      transition: width 0.8s ease;
    }

    .tip {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 15px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .angles-grid, .hooks-grid, .history-grid, .favorites-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      width: 100%;
    }

    .angle-card, .hook-item, .history-item, .favorite-item {
      background: var(--bg-secondary);
      border: 2px solid var(--border-color);
      padding: 12px;
      cursor: pointer;
      transition: all 0.1s;
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.1);
    }

    .angle-card:hover, .hook-item:hover, .history-item:hover, .favorite-item:hover {
      border-color: var(--accent-primary);
      background: var(--bg-primary);
      box-shadow: 3px 3px 0 var(--accent-primary);
    }

    .angle-name, .history-name {
      font-weight: 600;
      color: var(--accent-primary);
      margin-bottom: 4px;
      font-size: 13px;
    }

    .angle-sample, .history-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .hook-item {
      border-left: 3px solid var(--accent-secondary);
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      gap: 8px;
      align-items: center;
    }

    .favorite-item, .history-item {
      border-left: 3px solid var(--accent-secondary);
      display: grid;
      grid-template-columns: auto auto 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .hook-content {
      display: contents;
    }

    .hook-number {
      color: var(--accent-secondary);
      font-weight: 600;
      font-size: 12px;
      white-space: nowrap;
    }

    .hook-text, .favorite-content, .history-content {
      color: var(--text-primary);
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: break-word;
    }

    .favorite-content, .history-content {
      cursor: auto;
    }

    .favorite-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
      padding: 0;
      margin: 0;
      line-height: 1;
      white-space: nowrap;
      position: relative;
      opacity: 0.6;
    }

    .favorite-btn.active {
      opacity: 1;
      filter: drop-shadow(0 0 2px var(--accent-secondary));
    }

    .favorite-btn:hover {
      transform: scale(1.15);
    }

    .favorite-btn::after {
      content: "Save";
      position: absolute;
      bottom: -20px;
      right: 0;
      background: var(--accent-primary);
      color: var(--bg-primary);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      font-family: 'IBM Plex Mono', monospace;
    }

    .favorite-btn.active::after {
      content: "✓ Saved";
    }

    .favorite-btn:hover::after {
      opacity: 1;
    }

    .item-checkbox {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--accent-primary);
    }

    .trash-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      transition: all 0.1s;
      color: var(--text-secondary);
    }

    .trash-btn:hover {
      color: var(--accent-primary);
      transform: scale(1.15);
    }

    .select-all-section {
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .delete-selected-btn {
      width: 100%;
      background: #dc2626;
      color: white;
      border: 2px solid #dc2626;
      margin-top: 10px;
      display: none;
    }

    .delete-selected-btn.show {
      display: block;
    }

    .delete-selected-btn:hover {
      background: #b91c1c;
      border-color: #b91c1c;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-primary);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .section-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .script-display {
      background: var(--bg-secondary);
      border: 2px solid var(--border-color);
      padding: 15px;
      line-height: 1.8;
      color: var(--text-primary);
      white-space: pre-wrap;
      font-size: 12px;
      font-family: 'IBM Plex Mono', monospace;
      margin-bottom: 15px;
      max-height: 350px;
      overflow-y: auto;
    }

    .script-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .script-buttons button { margin-top: 0; }

    #backToHooksBtn {
      background: var(--accent-secondary);
      color: var(--text-primary);
      border-color: var(--accent-secondary);
    }

    .error {
      background: var(--bg-secondary);
      color: var(--accent-primary);
      padding: 10px 12px;
      border: 2px solid var(--accent-primary);
      margin-top: 15px;
      font-size: 12px;
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.1);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .error.hidden { display: none; }

    .warning-dialog {
      background: var(--bg-primary);
      border: 2px solid var(--accent-secondary);
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      margin-top: 15px;
    }

    .warning-dialog h3 {
      color: var(--accent-secondary);
      margin-bottom: 10px;
      font-size: 14px;
    }

    .warning-dialog p {
      color: var(--text-secondary);
      margin-bottom: 15px;
      font-size: 12px;
    }

    .dialog-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .dialog-buttons button {
      margin-top: 0;
      padding: 10px;
    }

    .dialog-buttons button:nth-child(2) {
      background: #dc2626;
      border-color: #dc2626;
    }

    .empty-message {
      text-align: center;
      color: var(--text-secondary);
      padding: 20px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    @media (max-width: 768px) {
      .wrapper { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="logo">UGC HOOK GEN</div>
    <button class="icon-btn" id="darkModeBtn">🌙</button>
  </div>

  <div class="wrapper">
    <div class="form-section">
      <div class="tabs">
        <button class="tab active" data-tab="generator">Create</button>
        <button class="tab" data-tab="favorites">Saved</button>
        <button class="tab" data-tab="history">History</button>
      </div>

      <div id="generator" class="tab-content active">
        <div class="form-header">
          <h1>CREATE HOOKS</h1>
          <p>Generate scroll-stopping hooks and scripts</p>
        </div>

        <form id="hookForm">
          <div class="form-group">
            <label>Product Name</label>
            <input type="text" id="productName" placeholder="Enter product name" required />
          </div>

          <div class="form-group">
            <label>Description</label>
            <textarea id="productDescription" placeholder="Describe your product..." required></textarea>
          </div>

          <div class="form-group">
            <label>Target Audience</label>
            <input type="text" id="targetAudience" placeholder="Who are you reaching? (optional)" />
          </div>

          <button type="submit">Generate</button>
        </form>

        <div class="error hidden" id="errorMessage"></div>
      </div>

      <div id="favorites" class="tab-content">
        <div class="form-header">
          <h1>SAVED HOOKS</h1>
          <p>Your favorite hooks</p>
        </div>
        <div id="favoritesList"></div>
      </div>

      <div id="history" class="tab-content">
        <div class="form-header">
          <h1>HISTORY</h1>
          <p>Recent generations</p>
        </div>
        <div id="historyList"></div>
      </div>
    </div>

    <div class="results-section" id="resultsSection">
      <div class="empty-state">
        <div class="empty-state-icon">█░█░█</div>
        <p>Ready to generate</p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("hookForm");
    const resultsSection = document.getElementById("resultsSection");
    const errorMessage = document.getElementById("errorMessage");
    const darkModeBtn = document.getElementById("darkModeBtn");
    const tabs = document.querySelectorAll(".tab");
    const tabContents = document.querySelectorAll(".tab-content");

    let currentProductData = {};
    let currentHooks = [];
    let favorites = JSON.parse(localStorage.getItem("ugcFavorites")) || [];
    let history = JSON.parse(localStorage.getItem("ugcHistory")) || [];
    let selectedFavoritesToDelete = new Set();
    let selectedHistoryToDelete = new Set();

    const isDarkMode = localStorage.getItem("darkMode") === "true";
    if (isDarkMode) {
      document.body.classList.add("dark-mode");
      darkModeBtn.textContent = "☀️";
    }

    darkModeBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
      const isNowDark = document.body.classList.contains("dark-mode");
      localStorage.setItem("darkMode", isNowDark);
      darkModeBtn.textContent = isNowDark ? "☀️" : "🌙";
    });

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        const tabName = tab.dataset.tab;
        tabs.forEach((t) => t.classList.remove("active"));
        tabContents.forEach((tc) => tc.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(tabName).classList.add("active");
        if (tabName === "favorites") displayFavorites();
        else if (tabName === "history") displayHistory();
      });
    });

    const tips = [
      "Problem hooks get more engagement",
      "First 3 seconds determine success",
      "Authenticity beats polish",
      "Test different angles weekly",
      "Native content performs best",
      "Show dont tell",
      "Curiosity hooks work well",
      "Be specific not generic",
    ];

    let stages = [
      { text: "Analyzing product details", progress: 25 },
      { text: "Generating creative angles", progress: 50 },
      { text: "Crafting scroll-stopping hooks", progress: 75 },
      { text: "Finalizing your hooks", progress: 95 },
    ];

    let currentStage = 0;
    let currentTip = 0;

    function showLoading() {
      currentStage = 0;
      currentTip = 0;
      updateLoading();
    }

    function updateLoading() {
      if (currentStage >= stages.length) return;
      const stage = stages[currentStage];
      resultsSection.innerHTML = `
        <div class="loading-container">
          <div class="loading-text">${stage.text}</div>
          <div class="animated-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
          <div class="progress-bar"><div class="progress-fill" style="width: ${stage.progress}%"></div></div>
          <div class="tip">${tips[currentTip % tips.length]}</div>
        </div>
      `;
      currentStage++;
      currentTip++;
      setTimeout(updateLoading, 800);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const productName = document.getElementById("productName").value;
      const productDescription = document.getElementById("productDescription").value;
      const targetAudience = document.getElementById("targetAudience").value;
      currentProductData = { productName, productDescription, targetAudience };

      // Check for duplicate history
      const duplicate = history.find(h => h.productName === productName && h.productDescription === productDescription);
      if (duplicate) {
        resultsSection.innerHTML = `
          <div class="warning-dialog">
            <h3>⚠️ History Already Exists</h3>
            <p>This product and description were already generated before.</p>
            <p>Do you want to generate again?</p>
            <div class="dialog-buttons">
              <button onclick="window.continueGenerate()">Yes, Generate</button>
              <button onclick="window.cancelGenerate()">Cancel</button>
            </div>
          </div>
        `;
        return;
      }

      performGenerate(productName, productDescription, targetAudience);
    });

    window.continueGenerate = function() {
      performGenerate(currentProductData.productName, currentProductData.productDescription, currentProductData.targetAudience);
    };

    window.cancelGenerate = function() {
      showEmpty();
    };

    function performGenerate(productName, productDescription, targetAudience) {
      const historyItem = { id: Date.now(), productName, productDescription, targetAudience, timestamp: new Date().toLocaleString() };
      history.unshift(historyItem);
      if (history.length > 20) history.pop();
      localStorage.setItem("ugcHistory", JSON.stringify(history));

      showLoading();
      errorMessage.classList.add("hidden");

      fetch("/api/angle-samples", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(currentProductData)
      })
      .then(r => {
        if (!r.ok) return r.json().then(d => { throw new Error(d.error || "Failed"); });
        return r.json();
      })
      .then(data => setTimeout(() => displayAngles(data.angles), 1200))
      .catch(error => {
        errorMessage.textContent = `Error: ${error.message}`;
        errorMessage.classList.remove("hidden");
        setTimeout(showEmpty, 500);
      });
    }

    function showEmpty() {
      resultsSection.innerHTML = `<div class="empty-state"><div class="empty-state-icon">█░█░█</div><p>Ready to generate</p></div>`;
    }

    function displayAngles(angles) {
      const defs = [
        { key: "problemFocused", label: "Problem" },
        { key: "benefitFocused", label: "Benefit" },
        { key: "curiosity", label: "Curiosity" },
        { key: "objectionHandling", label: "Objection" },
        { key: "comparison", label: "Comparison" },
      ];
      let html = `<div><div class="section-title">Select Angle</div><div class="section-subtitle">Choose your creative angle</div><div class="angles-grid">`;
      defs.forEach((d) => { html += `<div class="angle-card" data-angle="${d.key}"><div class="angle-name">${d.label}</div><div class="angle-sample">"${angles[d.key]}"</div></div>`; });
      html += `</div></div>`;
      resultsSection.innerHTML = html;
      document.querySelectorAll(".angle-card").forEach((c) => { c.addEventListener("click", () => generateHooksForAngle(c.dataset.angle)); });
    }

    async function generateHooksForAngle(angle) {
      showLoading();
      try {
        const response = await fetch("/api/generate-hooks", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...currentProductData, angle }) });
        if (!response.ok) throw new Error((await response.json()).error || "Failed");
        const data = await response.json();
        currentHooks = data.hooks;
        setTimeout(() => displayHooks(data.hooks), 1200);
      } catch (error) {
        errorMessage.textContent = `Error: ${error.message}`;
        errorMessage.classList.remove("hidden");
        setTimeout(showEmpty, 500);
      }
    }

    function displayHooks(hooks) {
      let html = `<div><div class="section-title">Your Hooks</div><div class="section-subtitle">Click to generate script</div><div class="hooks-grid">`;
      hooks.forEach((h, i) => {
        const fav = favorites.some((f) => f.hook === h);
        html += `<div class="hook-item"><div class="hook-content"><span class="hook-number">${i + 1}.</span><span class="hook-text" onclick="window.generateScript('${escapeHtml(h)}')">${h}</span></div><button class="favorite-btn ${fav ? "active" : ""}" onclick="window.toggleFavorite('${escapeHtml(h)}'); event.stopPropagation();">🔖</button></div>`;
      });
      html += `</div></div>`;
      resultsSection.innerHTML = html;
    }

    window.generateScript = async function (h) {
      showLoading();
      try {
        const response = await fetch("/api/generate-script", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ hook: h, ...currentProductData }) });
        if (!response.ok) throw new Error((await response.json()).error || "Failed");
        const data = await response.json();
        setTimeout(() => displayScript(data.script), 1200);
      } catch (error) {
        errorMessage.textContent = `Error: ${error.message}`;
        errorMessage.classList.remove("hidden");
        setTimeout(showEmpty, 500);
      }
    };

    function displayScript(script) {
      resultsSection.innerHTML = `<div><div class="section-title">Your Script</div><div class="script-display">${escapeHtml(script)}</div><div class="script-buttons"><button id="copyScriptBtn">Copy</button><button id="backToHooksBtn">Back</button></div></div>`;
      document.getElementById("copyScriptBtn").addEventListener("click", () => {
        navigator.clipboard.writeText(script);
        const btn = document.getElementById("copyScriptBtn");
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy"; }, 2000);
      });
      document.getElementById("backToHooksBtn").addEventListener("click", () => displayHooks(currentHooks));
    }

    window.toggleFavorite = function (h) {
      const idx = favorites.findIndex((f) => f.hook === h);
      if (idx > -1) {
        favorites.splice(idx, 1);
      } else {
        favorites.push({ 
          hook: h, 
          productName: currentProductData.productName,
          productDescription: currentProductData.productDescription,
          targetAudience: currentProductData.targetAudience || "",
          timestamp: new Date().toLocaleString() 
        });
      }
      localStorage.setItem("ugcFavorites", JSON.stringify(favorites));
      displayHooks(currentHooks);
    };

    function displayFavorites() {
      const list = document.getElementById("favoritesList");
      if (!favorites.length) { list.innerHTML = `<div class="empty-message">No favorites saved yet</div>`; return; }
      
      let html = `<div class="select-all-section"><input type="checkbox" id="selectAllFavorites" class="item-checkbox" onchange="window.toggleSelectAllFavorites()"><label for="selectAllFavorites" style="margin: 0; cursor: pointer;">Select All</label></div>`;
      html += `<div class="favorites-grid">`;
      favorites.forEach((f, i) => { 
        html += `<div class="favorite-item"><input type="checkbox" class="item-checkbox favorite-checkbox" data-index="${i}" onchange="window.updateFavoriteDelete()"><span class="hook-number">${i + 1}.</span><span class="favorite-content" onclick="window.loadFavoriteHook(${i})">${f.hook}</span><button class="trash-btn" onclick="window.deleteFavorite(${i}); event.stopPropagation();">🗑️</button></div>`; 
      });
      html += `</div>`;
      html += `<button class="delete-selected-btn" id="deleteFavoritesBtn" onclick="window.deleteBulkFavorites()">Delete Selected</button>`;
      list.innerHTML = html;
    }

    window.toggleSelectAllFavorites = function() {
      const checkboxes = document.querySelectorAll(".favorite-checkbox");
      const selectAll = document.getElementById("selectAllFavorites").checked;
      checkboxes.forEach(cb => cb.checked = selectAll);
      updateFavoriteDelete();
    };

    window.updateFavoriteDelete = function() {
      const checkboxes = document.querySelectorAll(".favorite-checkbox:checked");
      const btn = document.getElementById("deleteFavoritesBtn");
      if (checkboxes.length > 0) {
        btn.classList.add("show");
      } else {
        btn.classList.remove("show");
      }
    };

    window.deleteFavorite = function(i) {
      favorites.splice(i, 1);
      localStorage.setItem("ugcFavorites", JSON.stringify(favorites));
      displayFavorites();
    };

    window.deleteBulkFavorites = function() {
      const checkboxes = document.querySelectorAll(".favorite-checkbox:checked");
      const indicesToDelete = Array.from(checkboxes).map(cb => parseInt(cb.dataset.index)).sort((a, b) => b - a);
      indicesToDelete.forEach(i => favorites.splice(i, 1));
      localStorage.setItem("ugcFavorites", JSON.stringify(favorites));
      displayFavorites();
    };

    window.loadFavoriteHook = function(i) {
      const fav = favorites[i];
      currentProductData = {
        productName: fav.productName,
        productDescription: fav.productDescription,
        targetAudience: fav.targetAudience || ""
      };
      window.generateScript(fav.hook);
    };

    function displayHistory() {
      const list = document.getElementById("historyList");
      if (!history.length) { list.innerHTML = `<div class="empty-message">No history yet</div>`; return; }
      
      let html = `<div class="select-all-section"><input type="checkbox" id="selectAllHistory" class="item-checkbox" onchange="window.toggleSelectAllHistory()"><label for="selectAllHistory" style="margin: 0; cursor: pointer;">Select All</label></div>`;
      html += `<div class="history-grid">`;
      history.forEach((item, i) => { 
        html += `<div class="history-item"><input type="checkbox" class="item-checkbox history-checkbox" data-index="${i}" onchange="window.updateHistoryDelete()"><span class="hook-number">${i + 1}.</span><span class="history-content" onclick="window.loadHistoryItem(${i})">${item.productName}</span><button class="trash-btn" onclick="window.deleteHistory(${i}); event.stopPropagation();">🗑️</button></div>`; 
      });
      html += `</div>`;
      html += `<button class="delete-selected-btn" id="deleteHistoryBtn" onclick="window.deleteBulkHistory()">Delete Selected</button>`;
      list.innerHTML = html;
    }

    window.toggleSelectAllHistory = function() {
      const checkboxes = document.querySelectorAll(".history-checkbox");
      const selectAll = document.getElementById("selectAllHistory").checked;
      checkboxes.forEach(cb => cb.checked = selectAll);
      updateHistoryDelete();
    };

    window.updateHistoryDelete = function() {
      const checkboxes = document.querySelectorAll(".history-checkbox:checked");
      const btn = document.getElementById("deleteHistoryBtn");
      if (checkboxes.length > 0) {
        btn.classList.add("show");
      } else {
        btn.classList.remove("show");
      }
    };

    window.deleteHistory = function(i) {
      history.splice(i, 1);
      localStorage.setItem("ugcHistory", JSON.stringify(history));
      displayHistory();
    };

    window.deleteBulkHistory = function() {
      const checkboxes = document.querySelectorAll(".history-checkbox:checked");
      const indicesToDelete = Array.from(checkboxes).map(cb => parseInt(cb.dataset.index)).sort((a, b) => b - a);
      indicesToDelete.forEach(i => history.splice(i, 1));
      localStorage.setItem("ugcHistory", JSON.stringify(history));
      displayHistory();
    };

    window.loadHistoryItem = function(i) {
      const item = history[i];
      document.getElementById("productName").value = item.productName;
      document.getElementById("productDescription").value = item.productDescription;
      document.getElementById("targetAudience").value = item.targetAudience || "";
      document.querySelector('[data-tab="generator"]').click();
    };

    function escapeHtml(t) {
      const m = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" };
      return t.replace(/[&<>"']/g, (c) => m[c]);
    }

    displayFavorites();
    displayHistory();
  </script>
</body>
</html>
